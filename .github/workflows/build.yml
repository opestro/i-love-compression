name: build

on:
  push:
    branches: [main]
    tags: ["v*"] # scripts/release.sh pushes these; the release job below publishes them
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Fetch ffmpeg (static arm64)
        run: scripts/fetch-ffmpeg-macos.sh

      - name: Engine tests (images, real video encode, cancel)
        working-directory: engine
        run: PATH="$PWD/../vendor/ffmpeg:$PATH" cargo test -- --include-ignored

      - name: Build the app and DMG
        run: FFMPEG_DIR=vendor/ffmpeg macos/build.sh --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: I-Love-Compression-macOS
          path: build/I-Love-Compression.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: ilammy/setup-nasm@v1 # rav1e's x86 assembly (AVIF speed)
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # ffmpeg 8.1 on purpose: BtbN builds 8.0/8.1 against NVENC SDK 13.0 (NVIDIA driver 570+);
      # master/9.x use SDK 13.1, which refuses to encode on drivers below 610.
      - name: Fetch ffmpeg (BtbN 8.1 gpl static)
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $bin = (Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          Copy-Item "$bin/ffmpeg.exe" vendor/ffmpeg/
          $enc = & vendor/ffmpeg/ffmpeg.exe -hide_banner -encoders | Out-String
          foreach ($need in 'libx265', 'libsvtav1', 'libopus', 'hevc_nvenc', 'av1_nvenc') {
            if ($enc -notmatch " $need ") { throw "ffmpeg build lacks $need" }
          }

      - name: Engine tests (images, real video encode, cancel)
        shell: bash
        working-directory: engine
        run: PATH="$PWD/../vendor/ffmpeg:$PATH" cargo test -- --include-ignored

      - name: Build engine and app
        shell: pwsh
        run: |
          cargo build --release --manifest-path engine/Cargo.toml
          dotnet publish windows/ILoveCompression/ILoveCompression.csproj -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o "build/I Love Compression"
          Copy-Item engine/target/release/ilc-engine.exe, vendor/ffmpeg/ffmpeg.exe "build/I Love Compression/"
          Get-ChildItem "build/I Love Compression" | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: I-Love-Compression-Windows
          path: build/I Love Compression/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history for the release notes

      - name: Tag must match the version in every app
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$v\"" engine/Cargo.toml
          grep -A1 CFBundleShortVersionString macos/Info.plist | grep -q "<string>$v</string>"
          grep -q "<Version>$v</Version>" windows/ILoveCompression/ILoveCompression.csproj
          echo "V=$v" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Package
        run: |
          mkdir out
          mv dl/I-Love-Compression-macOS/I-Love-Compression.dmg "out/I-Love-Compression-$V-macOS-arm64.dmg"
          mv dl/I-Love-Compression-Windows "dl/I Love Compression"
          (cd dl && zip -qr "../out/I-Love-Compression-$V-Windows-x64.zip" "I Love Compression")
          ls -la out

      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## Download"
            echo "- **macOS** (Apple Silicon): \`I-Love-Compression-$V-macOS-arm64.dmg\`. Not signed yet: open it once, then System Settings → Privacy & Security → **Open Anyway**."
            echo "- **Windows** (x64): \`I-Love-Compression-$V-Windows-x64.zip\`. Unzip and run \`ILoveCompression.exe\`. On the SmartScreen warning click **More info → Run anyway**. GPU encoding needs an NVIDIA driver 570+."
            echo
            echo "## Changes"
            git log --no-merges --pretty='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME" | grep -v '^- Release v' || true
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "I Love Compression $V" --notes-file notes.md
